<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>Exploring HTML forms</title>
</head>
<body>
  <h2>Volenteer Form</h2>
  <form action="http://bloomingdale.sat.iit.edu/kriedan/lab3formscript.php" method="post">
    <fieldset>
      <legend>My Info:</legend>
      <label for="fname">First name:</label>
      <input type="text" id="fname" name="fname" ><br>
      <label for="lname">Last name:</label>
      <input type="text" id="lname" name="lname" ><br>
      <label for="phone">Phone number:</label>
      <input type="text" id="phone" name="phone"><br>
      <label for="email">Email:</label>
      <input type="text" id="email" name="email"><br>
      <label for="gender">Gender:</label><br>
      <label for="male">Male</label>
      <input type="radio" id="male" name="gender" value="male">        
      <label for="female">Female</label>
      <input type="radio" id="female" name="gender" value="female">
      <!--
      <label for="other">Non-binary</label>
      <input type="radio" id="non-binary" name="gender" value="non-binary">
      <label for="other">Other</label>
      <input type="radio" id="other" name="gender" value="other"><br>
      -->
      <input type="submit" value="Submit Query">
    </fieldset>
    <fieldset>
    <legend>My Availability</legend>
      All code for the fields under “My Availability”
    </fieldset>
  </form>
</body>
</html>
